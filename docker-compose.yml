version: '3.8'

services:
  app:
    build: .
    image: cabinet-manager:latest
    container_name: cabinet-manager
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret}
    volumes:
      - ./data:/app/server/data
